<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MOBA Real-Time AI Assistant</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">Dota AI Coach MVP</p>
        <h1>MOBA Real-Time AI Assistant</h1>
        <p class="description">
          Send a structured game scenario to the local FastAPI backend and view the rule-based carry recommendation.
        </p>
      </header>

      <section class="panel input-panel" aria-labelledby="scenario-heading">
        <div class="panel-heading">
          <h2 id="scenario-heading">Game Scenario JSON</h2>
          <span class="endpoint">POST http://127.0.0.1:8000/recommend</span>
        </div>
        <textarea id="scenario-input" spellcheck="false" aria-label="Game scenario JSON"></textarea>
        <button id="recommend-button" type="button">Get Recommendation</button>
      </section>

      <section id="result-panel" class="panel result-panel hidden" aria-labelledby="result-heading">
        <h2 id="result-heading">Recommendation</h2>
        <dl class="result-grid">
          <div>
            <dt>action</dt>
            <dd id="result-action"></dd>
          </div>
          <div>
            <dt>reason</dt>
            <dd id="result-reason"></dd>
          </div>
          <div>
            <dt>risk</dt>
            <dd id="result-risk"></dd>
          </div>
          <div>
            <dt>priority</dt>
            <dd id="result-priority"></dd>
          </div>
          <div>
            <dt>time_window</dt>
            <dd id="result-time-window"></dd>
          </div>
          <div>
            <dt>source</dt>
            <dd id="result-source"></dd>
          </div>
        </dl>
      </section>

      <section id="error-panel" class="panel error-panel hidden" aria-live="polite" aria-labelledby="error-heading">
        <h2 id="error-heading">Error</h2>
        <pre id="error-message"></pre>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
