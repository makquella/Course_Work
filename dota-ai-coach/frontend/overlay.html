<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dota AI Coach Overlay</title>
    <style>
      :root {
        color-scheme: light;
        --bg: rgba(238, 242, 245, 0.96);
        --card: #ffffff;
        --text: #17202a;
        --muted: #62717c;
        --border: #cfd8df;
        --primary: #216a5b;
        --warn: #9b4a1f;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 180px;
        background: var(--bg);
        color: var(--text);
      }

      main {
        padding: 12px;
      }

      .card {
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 10px 24px rgba(30, 43, 52, 0.12);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.2;
      }

      .badge {
        padding: 3px 8px;
        border-radius: 999px;
        background: #e8f2ef;
        color: var(--primary);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      dl {
        display: grid;
        gap: 9px;
        margin: 0;
      }

      dt {
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      dd {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .priority-high {
        color: #9f1f17;
      }

      .priority-medium {
        color: var(--warn);
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-live="polite">
        <div class="header">
          <h1>Dota AI Coach</h1>
          <span id="priority-badge" class="badge hidden"></span>
        </div>

        <p id="status" class="status">Waiting for Dota 2 GSI...</p>

        <dl id="recommendation" class="hidden">
          <div>
            <dt>Action</dt>
            <dd id="action"></dd>
          </div>
          <div>
            <dt>Reason</dt>
            <dd id="reason"></dd>
          </div>
          <div>
            <dt>Risk</dt>
            <dd id="risk"></dd>
          </div>
          <div>
            <dt>Time window</dt>
            <dd id="time-window"></dd>
          </div>
        </dl>
      </section>
    </main>

    <script>
      const statusEl = document.querySelector("#status");
      const recommendationEl = document.querySelector("#recommendation");
      const priorityBadge = document.querySelector("#priority-badge");
      const fields = {
        action: document.querySelector("#action"),
        reason: document.querySelector("#reason"),
        risk: document.querySelector("#risk"),
        time_window: document.querySelector("#time-window")
      };

      refreshRecommendation();
      setInterval(refreshRecommendation, 5000);

      async function refreshRecommendation() {
        try {
          const response = await fetch("/overlay/recommendation", { cache: "no-store" });
          const data = await response.json();
          renderOverlay(data);
        } catch (error) {
          showStatus("Backend unavailable. Start FastAPI and keep Dota 2 GSI enabled.");
        }
      }

      function renderOverlay(data) {
        if (data.status === "waiting_for_gsi") {
          showStatus("Waiting for Dota 2 GSI...");
          return;
        }

        if (data.status === "invalid_state") {
          showStatus("GSI state received, but it cannot be used for advice yet.");
          return;
        }

        if (data.status === "cooldown" && !data.recommendation) {
          showStatus("Advice cooldown active.");
          return;
        }

        if (!data.recommendation) {
          showStatus("No current advice.");
          return;
        }

        const recommendation = data.recommendation;
        for (const field of Object.keys(fields)) {
          fields[field].textContent = recommendation[field] || "";
        }

        priorityBadge.textContent = recommendation.priority || "fallback";
        priorityBadge.className = `badge priority-${recommendation.priority || "low"}`;
        priorityBadge.classList.remove("hidden");
        statusEl.classList.add("hidden");
        recommendationEl.classList.remove("hidden");
      }

      function showStatus(message) {
        statusEl.textContent = message;
        statusEl.classList.remove("hidden");
        recommendationEl.classList.add("hidden");
        priorityBadge.classList.add("hidden");
      }
    </script>
  </body>
</html>
